{% extends 'base.html' %}
{% block title %}Вход | КМЭиПТ{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="form-card animate__animated animate__fadeInUp">
                <div class="text-center mb-4">
                    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #1a237e, #283593); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                        <i class="fas fa-sign-in-alt" style="font-size: 2rem; color: white;"></i>
                    </div>
                    <h3 class="fw-bold">Вход в личный кабинет</h3>
                    <p class="text-muted">Войдите для доступа к заявлениям</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            <i class="fas fa-user me-2 text-primary"></i>Логин
                        </label>
                        <div class="input-group">
                            <span class="input-group-text" style="border-radius: 12px 0 0 12px;">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" name="username" class="form-control form-control-modern" 
                                   style="border-radius: 0 12px 12px 0;" 
                                   placeholder="Введите логин" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            <i class="fas fa-lock me-2 text-primary"></i>Пароль
                        </label>
                        <div class="input-group">
                            <span class="input-group-text" style="border-radius: 12px 0 0 12px;">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" name="password" class="form-control form-control-modern" 
                                   style="border-radius: 0 12px 12px 0;" 
                                   placeholder="Введите пароль" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient btn-modern w-100 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Войти
                    </button>
                </form>

                <div class="text-center">
                    <p class="text-muted">
                        Нет аккаунта? 
                        <a href="{% url 'register' %}" class="fw-bold text-primary">Зарегистрируйтесь</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
